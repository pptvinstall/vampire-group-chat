<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vampire Group Chat Ep 1 Shot Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a production slate up top, then a stripboard. Scene strips carry the
   stripboard colors (day/night, interior/exterior); everything else stays quiet. */
:root {
  --paper: #eceaf0;
  --card: #f8f7fa;
  --ink: #1d1622;
  --muted: #655c6e;
  --line: #d2ccd9;
  --accent: #8a1c2c;
  --accent-ink: #ffffff;
  --gold: #9a6c14;
  --ok: #1f7a4d;
  --strip-ext-day: #f0cf45;
  --strip-int-day: #ffffff;
  --strip-int-night: #86a9dc;
  --strip-ext-night: #7cc191;
  --strip-ink: #1d1622;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17121b;
    --card: #221b27;
    --ink: #f0eaf3;
    --muted: #a99fb3;
    --line: #3b3143;
    --accent: #e4667a;
    --accent-ink: #1d0b10;
    --gold: #e2b65c;
    --ok: #6fd3a0;
    --strip-ext-day: #d9b93a;
    --strip-int-day: #e9e4ee;
    --strip-int-night: #7397cc;
    --strip-ext-night: #68ad7e;
    --strip-ink: #17121b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17121b;
  --card: #221b27;
  --ink: #f0eaf3;
  --muted: #a99fb3;
  --line: #3b3143;
  --accent: #e4667a;
  --accent-ink: #1d0b10;
  --gold: #e2b65c;
  --ok: #6fd3a0;
  --strip-ext-day: #d9b93a;
  --strip-int-day: #e9e4ee;
  --strip-int-night: #7397cc;
  --strip-ext-night: #68ad7e;
  --strip-ink: #17121b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 40px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
h2 { font-size: 34px; font-weight: 800; text-transform: uppercase; line-height: 1; }
h3 { font-size: 22px; font-weight: 800; text-transform: uppercase; line-height: 1.05; }
p { margin: 0; max-width: 68ch; }
.lede { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
section { display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ---------- slate ---------- */
.slate { border: 2px solid var(--ink); background: var(--card); }
.clapper {
  height: 26px;
  background: repeating-linear-gradient(-55deg, var(--ink) 0 26px, var(--card) 26px 52px);
  border-bottom: 2px solid var(--ink);
}
.slate-body { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.slate h1 { font-size: clamp(44px, 10vw, 96px); font-weight: 900; line-height: 0.9; text-transform: uppercase; }
.slate h1 span { color: var(--accent); }
.slate-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); border-top: 2px solid var(--ink); border-left: 2px solid var(--ink); }
.slate-cell { border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.slate-cell b { font-family: var(--font-display); font-size: 26px; font-weight: 800; line-height: 1; }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
.bar { height: 10px; border: 1.5px solid var(--ink); background: var(--paper); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

/* ---------- jump bar ---------- */
.jump { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1.5px solid var(--line); margin: -20px -16px 0; padding: 8px 16px; overflow-x: auto; display: flex; gap: 6px; }
.jump button { flex: none; font: 500 13px var(--font-mono); padding: 6px 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; border-radius: 2px; }
.jump button:hover { border-color: var(--ink); }

/* ---------- buttons ---------- */
.copy { font: 600 14px var(--font-body); padding: 8px 12px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; border-radius: 2px; white-space: nowrap; }
.copy:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.copy.done { background: var(--ok); border-color: var(--ok); color: var(--paper); }
.copy.flow { background: transparent; color: var(--ink); }
.copy.flow:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.copy.flow.done { background: var(--ok); border-color: var(--ok); color: var(--paper); }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.okbox { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.okbox input { width: 18px; height: 18px; accent-color: var(--ok); margin: 0; }

details.prompt { width: 100%; }
details.prompt summary { cursor: pointer; font: 500 12px var(--font-mono); color: var(--muted); padding: 4px 0; }
details.prompt pre { margin: 6px 0 0; padding: 12px; background: var(--paper); border: 1.5px solid var(--line); font: 400 12.5px/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow-y: auto; }

/* ---------- team ---------- */
.team { display: grid; gap: 0; border-top: 1.5px solid var(--ink); }
.player { display: grid; grid-template-columns: 150px 130px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1.5px solid var(--line); align-items: start; }
.player b { font-family: var(--font-display); font-size: 22px; font-weight: 800; text-transform: uppercase; line-height: 1.05; }
.player .role { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); padding-top: 5px; }
.player small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
@media (max-width: 640px) { .player { grid-template-columns: 1fr; gap: 2px; } .player .role { padding-top: 0; } }

/* ---------- test ---------- */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; border-top: 1.5px solid var(--ink); counter-reset: step; }
.steps > li { counter-increment: step; display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1.5px solid var(--line); }
.steps > li::before { content: counter(step); font-family: var(--font-display); font-weight: 900; font-size: 40px; line-height: 0.9; color: var(--accent); }
.step-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.passbar { border: 1.5px solid var(--gold); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.passbar ul { margin: 0; padding-left: 18px; }

/* ---------- cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1.5px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.is-ok { border-color: var(--ok); }
.card-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.sid { font-family: var(--font-display); font-weight: 900; font-size: 30px; line-height: 0.9; }
.chip { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 6px; border: 1.5px solid var(--line); border-radius: 2px; color: var(--muted); }
.chip.test { border-color: var(--gold); color: var(--gold); }
.chip.edit { border-color: var(--accent); color: var(--accent); }
.card p { font-size: 14.5px; }
.card .who { font-weight: 600; }
.card-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: auto; }

/* ---------- stripboard ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.legend span { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; color: var(--strip-ink); border: 1.5px solid var(--ink); }
.ext-day { background: var(--strip-ext-day); }
.int-day { background: var(--strip-int-day); }
.int-night { background: var(--strip-int-night); }
.ext-night { background: var(--strip-ext-night); }
.scene { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 60px; }
.strip { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 8px 12px; color: var(--strip-ink); border: 2px solid var(--ink); }
.strip .num { font-family: var(--font-display); font-weight: 900; font-size: 44px; line-height: 0.85; }
.strip .ttl { font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; line-height: 1; }
.strip .meta { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; }
.strip .tc { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.sub { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.cuts { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--ink); }
.cuts li { display: grid; grid-template-columns: 34px 78px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1.5px solid var(--line); align-items: start; }
.cuts .n { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 4px; font-variant-numeric: tabular-nums; }
.cuts .cid { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.cuts .what { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cuts .line { font-size: 15.5px; }
.cuts .line b { font-weight: 700; }
.cuts .act { font-size: 13.5px; color: var(--muted); }
.cuts .ctl { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.cuts li.is-ok .cid { color: var(--ok); }
@media (max-width: 640px) {
  .cuts li { grid-template-columns: 28px 1fr; }
  .cuts .what, .cuts .ctl { grid-column: 2; }
  .cuts .ctl { flex-direction: row; align-items: center; flex-wrap: wrap; }
  .strip { grid-template-columns: auto 1fr; }
  .strip .tc { grid-column: 2; text-align: left; }
}

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 460px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1.5px solid var(--line); font-size: 15px; }
th { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1.5px solid var(--ink); }
td.num, th.num { text-align: right; }

.cues { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.calls { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
.calls .card ol { margin: 0; padding-left: 22px; font-size: 14.5px; display: flex; flex-direction: column; gap: 4px; }
.calls .card ol { list-style: upper-alpha; }
.made { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 72ch; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; font: 500 14px var(--font-body); border-radius: 2px; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

</style>
</head>

// Prompt builders shared by the page and the checker.
const STYLE = "Grounded, expressive, cinematic stylized 3D animation. Soft geometric faces, expressive eyes, smooth but real skin shading, believable fabric. Not photoreal, not live-action, not anime, not flat illustration.";

function plateById(B, id) { return B.plates.find(p => p.id === id); }
function allStills(B) { return B.scenes.flatMap(sc => sc.stills.map(s => ({ ...s, scene: sc.n }))); }
function stillById(B, id) { return allStills(B).find(s => s.id === id); }
function allCuts(B) { return B.scenes.flatMap(sc => sc.cut.map(c => ({ ...c, scene: sc.n }))); }

function kickoffPrompt(B) {
  const C = B.chars;
  return [
    "You are the still-image artist for THE VAMPIRE GROUP CHAT, an original stylized 3D animated comedy set in Shadow Creek, Georgia, a fictional suburb of Atlanta.",
    "",
    "The cast is Eiesha, Bianca, Stefon, Daymondre, Marquell and Vanesha. We build one character sheet for each in this chat first. Once I approve a sheet, it is the only source of truth for that character's face, hair, skin tone, glasses, jewelry and outfit.",
    "",
    "Rules for every image in this chat:",
    "1. One look only: " + STYLE,
    "2. Never redesign anyone. No added tattoos, facial hair, accessories, hairstyles or outfit changes. Everyone wears the same clothes all episode, because the story happens in one day.",
    "3. Vertical 9:16, framed for a phone screen. Keep heads and hands out of the top and bottom 10% of the frame.",
    "4. No readable text of any kind: no signs, captions, phone-screen text, logos or watermarks. Leave sign panels and phone screens blank. Text gets added later in the edit.",
    "5. One single frame per prompt. Never a grid, a collage or multiple panels. The only exception is a prompt labelled CHARACTER SHEET.",
    "6. Only the characters I name appear in the foreground. Background people stay blurred and faceless.",
    "7. These are original characters. Do not base anyone on a real actor or on an existing show.",
    "8. I will send prompts labelled CHARACTER SHEET, PLATE or STILL with an ID. Reply with the image and repeat the ID. If something in a prompt conflicts with the character sheets, the sheets win; tell me what you changed.",
    "",
    "Identity locks:",
    "- " + C.S.lock,
    "- " + C.D.lock,
    "- Marquell wears the Creekside Grill dark polo and burgundy apron in every image. Vanesha is his older sister: family resemblance, not the same face.",
    "- Bianca is East Asian-American. Eiesha, Stefon and Daymondre are Black. Marquell and Vanesha are Latino. Skin tones never shift between images.",
    "",
    "Reply \"Locked in\" and wait for the first prompt."
  ].join("\n");
}

function sheetPrompt(B, sh, i) {
  const C = B.chars, ch = C[sh.k], first = i === 0;
  const lines = [
    "CHARACTER SHEET — " + ch.name + " (" + (i + 1) + " of " + B.sheets.length + ")",
    first
      ? "Update to the kickoff: we are making the six character sheets here first, one at a time. A prompt labelled CHARACTER SHEET is the one exception to rule 5."
      : "Same recipe as the Daymondre sheet. A prompt labelled CHARACTER SHEET is the one exception to rule 5.",
    "",
    "ATTACHED: " + sh.ref + " (old reference for " + ch.name + ")" + (first ? "." : ", plus the approved new Daymondre sheet as the style reference."),
    "Use the old reference for identity only: face shape, features, skin tone, hair and build. Redraw " + ch.name + " in our locked look: " + STYLE,
    first
      ? "This sheet sets the look for the whole cast, so get the shading and proportions right here."
      : "Match the approved Daymondre sheet exactly for rendering style, skin shading, eye size and body proportions, so the cast looks like one show. Different person, same show.",
    "",
    "WHO: " + ch.look,
    "OUTFIT (the only one, worn all episode): " + sh.outfit,
    "",
    "LAYOUT: one landscape 3:2 image on a plain mid-gray studio background.",
    "- Left: full body, front view, relaxed neutral stance.",
    "- Center: large face close-up, neutral expression.",
    "- Right: three smaller full-body views: three-quarter, side and back.",
    "- Bottom row: five head-and-shoulders expressions: " + sh.faces + "."
  ];
  if (sh.extra) lines.push("- " + sh.extra);
  lines.push("");
  lines.push("RULES:");
  lines.push("- The same face, hair and outfit in every panel.");
  lines.push("- No text, labels, names, captions or logos anywhere on the sheet.");
  lines.push("- An original character. Not based on any real actor or existing show.");
  if (ch.lock) lines.push("- " + ch.lock);
  lines.push("- " + sh.drop);
  return lines.join("\n");
}

function platePrompt(B, p) {
  return [
    "PLATE " + p.id + " — " + p.name,
    "Vertical 9:16 location plate. No characters in the foreground. No readable text anywhere.",
    "Style: " + STYLE,
    "",
    p.desc,
    "",
    "This is a locked set. Every later still in this location must match this layout, these colors and this lighting."
  ].join("\n");
}

function stillPrompt(B, s) {
  const C = B.chars;
  const p = plateById(B, s.plate);
  if (s.custom === "vamp") {
    return [
      "STILL 08V — edit of the approved STILL 08D (attach 08D).",
      "Change only three things:",
      "1. His irises become red-amber.",
      "2. Faint dark veins appear under both eyes.",
      "3. His lips part to show two small fangs.",
      "Everything else stays identical: same face shape, goatee, skin tone, hair, leather jacket, gold bat pendant, framing and lighting.",
      "No blood, no wounds, no text. Vertical 9:16."
    ].join("\n");
  }
  const who = (s.who || []).map(k => "- " + C[k].name + ": " + C[k].look);
  const back = (s.back || []).map(k => "- " + C[k].name + ", back to camera: we see only " + s.backNote);
  const inFrame = s.inFrame ? ["- " + s.inFrame] : who.concat(back);
  const keys = (s.who || []).concat(s.back || []);
  const rules = [
    "Only the people listed above appear in the foreground. Background people stay blurred and faceless.",
    "No captions, signs, logos or readable text. Phone screens and sign panels stay blank.",
    "No outfit, hair or skin-tone changes from the character sheets."
  ];
  if (keys.includes("S")) rules.push(C.S.lock);
  if (keys.includes("D")) rules.push(C.D.lock);
  const attach = ["plate " + s.plate].concat(keys.map(k => C[k].name + " sheet"));
  return [
    "STILL " + s.id + " — vertical 9:16, one single frame.",
    "Attach with this prompt: " + attach.join(", ") + ".",
    "Style: same locked look as the kickoff. " + STYLE,
    "",
    "LOCATION: plate " + p.id + ", " + p.name + ". Match the approved plate exactly." + (s.light ? " " + s.light : ""),
    "IN FRAME:",
    inFrame.join("\n"),
    "FRAMING: " + s.frame,
    "MOMENT: " + s.moment,
    "RULES:",
    rules.map(r => "- " + r).join("\n")
  ].join("\n");
}

function clipLength(c) {
  if (c.len) return c.len;
  if (!c.line) return 4;
  const words = c.line.trim().split(/\s+/).length;
  if (words <= 5) return 4;
  if (words <= 13) return 6;
  return 8;
}

function clipPrompt(B, c) {
  const C = B.chars;
  const s = stillById(B, c.still);
  const p = plateById(B, s.plate);
  const lines = [
    "CLIP " + c.id + " — start frame: STILL " + c.still + (c.end ? ". Last frame, if Flow offers one: STILL " + c.end : "") + ".",
    "Vertical 9:16. One continuous shot, no cuts. Length: " + clipLength(c) + " seconds.",
    "",
    "THE VAMPIRE GROUP CHAT. Premium expressive stylized 3D animation that matches the start frame exactly: same face, hair, skin tone, wardrobe, set and lighting from first frame to last. Natural, restrained acting. No morphing, no new characters, no outfit changes, no captions, no subtitles, no on-screen text.",
    "",
    "ACTION: " + c.act,
    "CAMERA: " + (c.cam || "Hold the start frame's framing. At most a very slow push-in.")
  ];
  if (c.line) {
    const ch = C[c.who];
    lines.push("DIALOGUE: " + ch.name + " says: " + c.line);
    lines.push("VOICE: " + ch.voice + ".");
    lines.push("Only " + ch.name + " speaks, once, then stops." + (c.ots ? " " + c.ots + " stays back-to-camera, silent, and does not turn around." : ""));
  } else {
    lines.push("DIALOGUE: none. Nobody speaks. Mouths stay closed unless the action says otherwise.");
  }
  lines.push("AUDIO: " + p.tone + ". No music.");
  return lines.join("\n");
}

function punchUpPrompt(B) {
  const C = B.chars;

    "",
    "Your job: make it funnier without breaking the shoot. The shots are already planned line by line, so these rules are hard limits:",
    "1. Same 12 scenes, same speakers, same number of lines in the same order.",
    "2. A new line can be at most 3 words longer than the line it replaces.",
    "3. Jokes come from character: Bianca's quick suspicion, Eiesha's dry wit, Marquell's literal deflection, Vanesha's independence, Stefon's stiff awkwardness, Daymondre's smug excuses.",
    "4. Atlanta references must be something that character would really say. Keep Peach Pass, lemon-pepper wet, Buckhead and 285 unless you can clearly beat them.",
    "5. No new characters, first names only, no narrator, nothing that makes Vanesha's attack a joke.",
    "6. Suggest at most 8 swaps. Leave a line alone if it already works.",
    "",
    "Give me a table: scene number, speaker, original line, new line, one sentence on why it is funnier.",
    "",
    "LOCKED V7 SCRIPT"
  ];
  B.scenes.forEach(sc => {
    out.push("");
    out.push("Scene " + sc.n + " — " + sc.title + ", " + sc.when);
    B.script[sc.n].forEach(l => {
      const [k, text] = l.split("|");
      out.push(C[k].name + ": " + text);
    });
    if (sc.n === 10) out.push("(Group chat on screen — Marquell: Vanesha got attacked. I'm with her. Call somebody! / Kari: AT CREEKSIDE??? / Bianca: I'm calling 911. Everybody stay inside.)");
  });
  return out.join("\n");
}

    '<p class="lede">Google AI Pro includes 1,000 credits a month plus 50 a day, so my plan fits inside one month if Lite passes the test. That is an assumption until I see the three clips: if Lite cannot hold a face, the episode runs on Fast and spills into a second month or a credit top-up. ChatGPT images have no posted count on Plus, but it slows you down in bursts, so expect the ' + imagesTotal + " images to take a few sittings.</p></section>";

  // ----- calls -----
  const call = (t, body, opts) => '<div class="card"><h3>' + esc(t) + "</h3><p>" + esc(body) + "</p><ol>" + opts.map(o => "<li>" + esc(o) + "</li>").join("") + "</ol></div>";
  const calls =
    '<section id="calls"><h2>Three calls that are yours</h2><div class="calls">' +
    call("1 · Voices", "Your style bible wants one recorded voice per character, lip-synced. None of your four subscriptions lip-syncs to a supplied voice track. For the test I let Veo speak each line, with the same voice description pasted every time.",
      ["Veo voices for the test; judge the drift when we hear it (my pick).", "Hold the bible's rule now: add a voice and lip-sync tool before any talking clip gets made."]) +
    call("2 · Open on the chat", "The show is called The Vampire Group Chat, but in V7 the chat first appears at 2:06. A three-second chat bubble before scene 1 costs no credits, because I build it in the edit, and gives the first seconds a hook.",
      ["Add a cold-open chat bubble; ChatGPT pitches the line (my pick).", "Keep V7 exactly as written."]) +
    call("3 · Your Google plan", "The credit math above assumes Google AI Pro. Tell me which one you pay for and I will redo the budget.",
      ["AI Pro, $19.99.", "AI Plus, $4.99.", "Ultra.", "Not sure. I will check."]) +
    "</div>" +
    '<h3>Calls I already made</h3><ul class="made">' +
    "<li>Two-person moments are shot over the shoulder, so only one mouth is on camera. That is the fix for the swapped voices in the old clip 5.</li>" +
    "<li>Signs, phone screens and the group chat are blank in every still. I add the words in the edit.</li>" +
    "<li>Four moments need no video credits: the two storefront shots, the phone on the asphalt, and the chat graphic.</li>" +
    "<li>Daymondre's vampire face is an edit of his own approved close-up, so the face under the fangs cannot change.</li>" +
    "<li>I added one silent beat in scene 12: Daymondre turns cold for two seconds before the AP History joke. Your continuity notes ask for that; the script did not have a shot for it. The script's red-eye flash still ends the episode.</li>" +
    "<li>Marquell's line in scene 9 is split so he shouts \"Vee!\" at the door and says the rest crouched beside her.</li>" +
    "<li>None of the V6 footage is used. Your continuity notes mark it as scratch.</li>" +
    "</ul></section>";

  document.getElementById("app").innerHTML = slate + jump + test + cast + team + looks + scenes + beats + budget + calls;

  // ----- behavior -----
  const toast = document.getElementById("toast");
  let toastTimer;
  const say = m => { toast.textContent = m; toast.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 2200); };

  function revealAndSelect(key) {
    const d = document.getElementById("d-" + key), pre = document.getElementById("t-" + key);
    if (!d || !pre) return;
    d.open = true;
    const r = document.createRange(); r.selectNodeContents(pre);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    pre.scrollIntoView({ block: "center" });
  }
  function flash(btn) { btn.classList.add("done"); const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.classList.remove("done"); btn.textContent = t; }, 1400); }

  function refresh() {
    const img = Object.keys(ticks).filter(k => ticks[k] && k.indexOf("img-") === 0).length;
    const clip = Object.keys(ticks).filter(k => ticks[k] && k.indexOf("clip-") === 0).length;
    document.getElementById("m-img").textContent = img + " / " + imagesTotal;
    document.getElementById("m-clip").textContent = clip + " / " + veo.length;
    document.getElementById("b-img").style.width = (100 * img / imagesTotal) + "%";
    document.getElementById("b-clip").style.width = (100 * clip / veo.length) + "%";
    document.querySelectorAll("[data-card]").forEach(el => {
      const k = el.getAttribute("data-card").replace(/^sheet-/, "img-sheet-").replace(/^(plate|still)-/, "img-");
      el.classList.toggle("is-ok", !!ticks[k]);
    });
  }

  document.addEventListener("click", e => {
    const cb = e.target.closest("[data-copy]");
    if (cb) {
      const key = cb.getAttribute("data-copy"), text = TEXT[key];
      let p;
      try { p = navigator.clipboard.writeText(text); } catch (err) { p = Promise.reject(err); }
      p.then(() => { flash(cb); say("Copied. Paste it into " + (key.indexOf("clip-") === 0 ? "Flow." : "ChatGPT.")); })
        .catch(() => { revealAndSelect(key); say("Copy is blocked here. The prompt is selected: press Ctrl+C or Cmd+C."); });
      return;
    }
    const jb = e.target.closest("[data-jump]");
    if (jb) { const t = document.getElementById(jb.getAttribute("data-jump")); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); }
  });
  document.addEventListener("change", e => {
    const k = e.target.getAttribute && e.target.getAttribute("data-ok");
    if (!k) return;
    ticks[k] = e.target.checked; save(); refresh();
  });
  refresh();
})();

</script>
</body>
</html>
